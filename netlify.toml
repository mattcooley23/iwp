# Netlify configuration for the Inspire Wealth Partners site.
# Static site — no build step; publish this folder as-is.

[build]
  publish = "."
  command = ""

# Do NOT let Netlify minify/bundle HTML/JS/CSS — it mangles the runtime template.
[build.processing]
  skip_processing = true

# HTML must always revalidate so redeploys are never served stale.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# JavaScript must be served with the correct MIME type or browsers refuse to run it.
[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# Images/fonts can be long-cached (they are content-stable).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
